name: Deploy to GitHub Pages

on:
    push:
        branches: [main]

permissions:
    pages: write
    id-token: write

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "pnpm"
            - run: pnpm install
            - run: pnpm lint

    build:
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "pnpm"
            - run: pnpm install
            - run: pnpm build
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/deploy-pages@v5
              id: deployment
